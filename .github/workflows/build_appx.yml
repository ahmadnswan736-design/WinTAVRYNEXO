name: Build WinTAVRYNEXO Store APPX & MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Pack Official Store APPX
      shell: pwsh
      run: |
        Write-Host "1. Publishing WinTAVRYNEXO v1.0.1..."
        dotnet publish WinTAVRYNEXO/WinTAVRYNEXO.csproj -c Release -r win-x64 --self-contained true -o ./publish

        Write-Host "2. Preparing Manifest..."
        (Get-Content WinTAVRYNEXO/Package.appxmanifest) -replace 'Language="x-generate"', 'Language="en-us"' | Set-Content ./publish/AppxManifest.xml
        if (Test-Path WinTAVRYNEXO/Package.StoreAssociation.xml) {
            Copy-Item WinTAVRYNEXO/Package.StoreAssociation.xml ./publish/ -Force
        }

        Write-Host "3. Copying Official Icons to Package..."
        New-Item -ItemType Directory -Path ./publish/Assets -Force
        Copy-Item -Recurse WinTAVRYNEXO/Assets/* ./publish/Assets/ -Force

        Write-Host "4. Packaging APPX & MSIX with MakeAppx..."
        $makeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
        New-Item -ItemType Directory -Path ./store_package -Force

        & $makeAppx pack /d ./publish /p ./store_package/WinTAVRYNEXO.appx /nv /v
        & $makeAppx pack /d ./publish /p ./store_package/WinTAVRYNEXO.msix /nv /v
        Write-Host "Successfully packaged WinTAVRYNEXO with your custom icons!"

    - name: Upload Store Package
      uses: actions/upload-artifact@v4
      with:
        name: WinTAVRYNEXO-Store-Package-v1.0.1
        path: ./store_package/
        if-no-files-found: error
