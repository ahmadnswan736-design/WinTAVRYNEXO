name: Build WinTAVRYNEXO Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish WinTAVRYNEXO
      shell: bash
      run: |
        # البحث عن ملف المشروع أينما كان وتجميعه
        PROJ_FILE=$(find . -name "*.csproj" | head -n 1)
        echo "Found project: $PROJ_FILE"
        dotnet publish "$PROJ_FILE" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./build_output

    - name: Upload WinTAVRYNEXO Package
      uses: actions/upload-artifact@v4
      with:
        name: WinTAVRYNEXO-Release-x64
        path: ./build_output/
        if-no-files-found: error
