name: Build WinTAVRYNEXO Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Publish WinTAVRYNEXO
      shell: pwsh
      run: |
        dotnet publish WinTAVRYNEXO/WinTAVRYNEXO.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Upload WinTAVRYNEXO Package
      uses: actions/upload-artifact@v4
      with:
        name: WinTAVRYNEXO-Release-x64
        path: ./publish
        if-no-files-found: error
